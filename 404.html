<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Página não encontrada | IFAR Digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: marca no topo, bloco central com o 404 em destaque, rodapé discreto. Tudo com caminhos absolutos para funcionar em qualquer endereço. */
:root{
  --bg:#000;
  --line:#1F1F22;
  --line-2:#2E2E33;
  --fg:#fff;
  --muted:#A1A1A6;
  --dim:#6E6E73;
  --accent:#FF5F1F; /* cor da marca: troque aqui */
  --font:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
h1,p{margin:0}
.wrap{width:100%;max-width:1120px;margin:0 auto}
header{padding:28px 0}
.brand{display:inline-flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-size:24px;font-weight:800;letter-spacing:.14em}
.brand span{font-size:10px;font-weight:600;letter-spacing:.38em;color:var(--accent)}
main{flex:1;display:flex;align-items:center}
.box{padding:48px 0 72px}
.kicker{margin-bottom:20px;font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--accent);text-transform:uppercase}
.code{font-size:clamp(96px,22vw,220px);font-weight:300;line-height:.95;letter-spacing:-.04em;display:flex;align-items:center}
.code .o{display:inline-block;width:.62em;height:.62em;margin:0 .06em;border:.07em solid var(--accent);border-radius:50%}
h1{margin-top:32px;font-size:clamp(28px,4.2vw,44px);font-weight:300;line-height:1.15;letter-spacing:-.01em}
h1 b{font-weight:700}
.lead{margin-top:16px;max-width:520px;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line-2);color:var(--fg);transition:border-color .15s ease,transform .15s ease,background .15s ease}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.985)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#000}
.btn.solid:hover{background:#ff7440;border-color:#ff7440}
.btn svg{width:20px;height:20px;flex:none}
footer{padding:28px 0 32px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
@media (max-width:720px){
  .cta .btn{width:100%}
  .box{padding:24px 0 48px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="brand" href="/" aria-label="IFAR Digital, voltar ao início"><b>IFAR</b><span>DIGITAL</span></a>
  </header>
</div>

<main class="wrap">
  <div class="box">
    <p class="kicker">Erro 404</p>
    <div class="code" aria-hidden="true">4<span class="o"></span>4</div>
    <h1>Aqui <b>não tem sinal.</b></h1>
    <p class="lead">Essa página não existe ou mudou de lugar. Volte ao início, que a conexão está de pé, ou fale com a gente pelo WhatsApp.</p>
    <div class="cta">
      <a class="btn solid" href="/">Voltar ao início</a>
      <a class="btn" href="https://wa.me/5534999266957?text=Ol%C3%A1!%20Quero%20falar%20com%20a%20IFAR%20Digital.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.9 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/></svg>
        Falar no WhatsApp
      </a>
    </div>
  </div>
</main>

<div class="wrap">
  <footer>IFAR Digital · Somos a sua conexão.</footer>
</div>

</body>
</html>
