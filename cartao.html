<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartão Digital | IFAR Digital</title>

<meta name="theme-color" content="#ff6a00">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --orange:#ff6a00;
    --bg:#050505;
    --card:#111111;
    --text:#ffffff;
    --gray:#cfcfcf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Montserrat',sans-serif;

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:30px;

}

.container{

    width:100%;
    max-width:500px;

    text-align:center;

}

.logo{

    font-size:2rem;
    font-weight:800;

    letter-spacing:4px;

    color:var(--orange);

    margin-bottom:20px;

}

.slogan{

    font-size:1.8rem;

    font-weight:700;

    margin-bottom:15px;

}

.subtitle{

    color:var(--gray);

    line-height:1.8;

    margin-bottom:40px;

}

.buttons{

    display:flex;
    flex-direction:column;

    gap:16px;

}

.btn{

    background:var(--card);

    border:1px solid rgba(255,106,0,.2);

    padding:18px;

    border-radius:16px;

    text-decoration:none;

    color:white;

    font-weight:600;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-4px);

    border-color:var(--orange);

}

.footer{

    margin-top:40px;

    color:#888;

    font-size:.9rem;

    line-height:1.8;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

IFAR DIGITAL

</div>

<div class="slogan">

Somos a sua conexão.

</div>

<div class="subtitle">

Tecnologia e conectividade.

<br>

Iturama • MG

</div>

<div class="buttons">

<a
class="btn"
href="https://wa.me/5534999266957"
target="_blank"
rel="noopener noreferrer">

📱 WhatsApp

</a>

<a
class="btn"
href="https://ifardigital.com.br">

🌐 Site Oficial

<a
  class="btn"
  href="/IFAR_Digital.vcf"
  download="IFAR_Digital.vcf"
  type="text/vcard"
>
  💾 Salvar contato
</a>

<a
    class="btn"
    href="https://www.google.com/maps/search/?api=1&query=Iturama%2C+MG"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Abrir localização da IFAR Digital no mapa"
>
    📍 Localização
</a>
<a
class="btn"
href="https://wa.me/5534999266957">

🚀 Solicitar Instalação

</a>

</div>

<div class="footer">

IFAR Digital

<br>

Tecnologia. Confiança. Futuro.

</div>

</div>

</body>

</html>
