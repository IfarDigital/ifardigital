:root{
    --bg:#050505;
    --bg2:#101010;
    --orange:#ff6a00;
    --orange-light:#ff8c00;
    --white:#ffffff;
    --gray:#d0d0d0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    color:white;
    overflow-x:hidden;
}

/* PARTICULAS */

#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:var(--orange);
    opacity:.4;
    box-shadow:
    0 0 10px var(--orange),
    0 0 20px var(--orange);
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    10%{
        opacity:.8;
    }

    100%{
        transform:translateY(-180px);
        opacity:0;
    }
}

/* MENU */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 10%;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,106,0,.15);
    z-index:1000;
}

.logo{
    font-weight:800;
    letter-spacing:4px;
    color:var(--orange);
}

.menu a{
    text-decoration:none;
    color:white;
    margin-left:25px;
    transition:.3s;
}

.menu a:hover{
    color:var(--orange);
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:120px 30px;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    width:900px;
    height:900px;

    background:
    radial-gradient(
    circle,
    rgba(255,106,0,.20),
    transparent 70%
    );

    animation:pulse 8s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }

}

.hero-content{
    max-width:1000px;
    z-index:3;
}

.glow-title{
    font-size:5rem;
    line-height:1;
    animation:titleGlow 3s infinite alternate;
}

.glow-title span{
    color:var(--orange);
}

@keyframes titleGlow{

    from{
        text-shadow:
        0 0 10px rgba(255,106,0,.4);
    }

    to{
        text-shadow:
        0 0 20px rgba(255,106,0,.8),
        0 0 60px rgba(255,106,0,.8);
    }

}

.hero h2{
    margin-top:20px;
    color:var(--gray);
    font-weight:300;
}

.hero p{
    max-width:850px;
    margin:30px auto 0;
    line-height:2;
    color:var(--gray);
}

.btn{
    display:inline-block;
    margin-top:40px;
    padding:18px 40px;
    background:var(--orange);
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-weight:700;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    background:var(--orange-light);
    box-shadow:0 0 30px rgba(255,106,0,.5);
}

/* SEÇÕES */

section{
    padding:120px 10%;
    position:relative;
    z-index:2;
}

.section-title{
    font-size:3rem;
    text-align:center;
    margin-bottom:60px;
}

.about{
    max-width:900px;
    margin:auto;
    text-align:center;
    line-height:2;
    color:var(--gray);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,106,0,.12);
    padding:35px;
    border-radius:25px;
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);

    box-shadow:
    0 0 30px rgba(255,106,0,.20);

    border-color:var(--orange);
}

.card h3{
    color:var(--orange);
    margin-bottom:15px;
}

.card p{
    color:var(--gray);
    line-height:1.8;
}

.quote{
    max-width:900px;
    margin:auto;
    text-align:center;
    font-size:2rem;
    font-weight:700;
}

.founder{
    max-width:900px;
    margin:auto;
    text-align:center;
}
